name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: |
          node --check dist/app.mjs
          node --check dist/data.mjs
      - name: Verificar buscas principais
        run: node scripts/smoke.mjs

      - name: Verificar curadoria ampliada
        run: node scripts/check-curadoria-ampliada.mjs

      - name: Verificar leituras gratuitas
        run: node scripts/check-leituras-gratuitas.mjs

      - name: Verificar curadoria de novembro
        run: node scripts/check-curadoria-novembro.mjs

      - name: Verificar Expansao Editorial III
        run: node scripts/check-expansao-iii.mjs

      - name: Verificar consolidacao bibliografica I
        run: node scripts/check-consolidacao-bibliografica-i.mjs

      - name: Auditar catálogo completo
        run: node scripts/auditar-catalogo.mjs --strict

      - name: Verificar politicas editoriais dos periodicos
        run: node scripts/check-politicas-periodicos.mjs

      - name: Verificar relacoes editoriais
        run: node scripts/check-relacoes-editoriais.mjs

      - name: Verificar termos adicionais de busca
        run: node scripts/check-termos-busca.mjs

      - name: Verificar fontes oficiais e bibliografia adicional
        run: node scripts/check-verificacao-complementar.mjs

      - name: Verificar piloto bibliografico Ciclo 1
        run: node scripts/check-ciclo1-bibliografia.mjs

      - name: Verificar Ciclo 2 bibliografico
        run: node scripts/check-ciclo2-bibliografia.mjs
