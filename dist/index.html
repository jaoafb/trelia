<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0f0e">
  <meta name="description" content="Encontre livros por assunto em Direito Penal I e veja onde o tema aparece em cada edição.">
  <title>Trelia.</title>
  <link rel="icon" href="./trelia.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./ui/capa.css">
  <link rel="stylesheet" href="./ui/hero-artwork.css">
  <script>
    if (location.protocol === "https:") {
      window.va = window.va || function () {
        (window.vaq = window.vaq || []).push(arguments);
      };
      window.va("beforeSend", event => {
        const url = new URL(event.url);
        url.search = "";
        url.hash = "";
        return { ...event, url: url.href };
      });
      const analytics = document.createElement("script");
      analytics.src = "/_vercel/insights/script.js";
      document.head.append(analytics);
    }
  </script>
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip" href="#conteudo">Ir para o conteúdo</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="#inicio" aria-label="Trelia, início">
        <img class="brand-mark" src="./trelia.svg" width="36" height="36" alt="">
        <span>Trelia.</span>
      </a>
      <nav aria-label="Navegação principal">
        <a class="nav-link" href="#duvidas">Guias</a>
      </nav>
    </div>
  </header>
  <main id="conteudo" tabindex="-1"></main>
  <footer class="footer">
    <div class="shell footer-inner">
      <a class="brand" href="#inicio" aria-label="Trelia, início">
        <img class="brand-mark" src="./trelia.svg" width="36" height="36" alt="">
        <span>Trelia.</span>
      </a>
      <p>Seu ponto de partida para estudar com direção.</p>
      <button type="button" class="footer-feedback feedback-trigger">Dar feedback <span aria-hidden="true">→</span></button>
    </div>
  </footer>
  <dialog id="feedback" aria-labelledby="feedback-titulo">
    <form method="dialog" class="dialog-head">
      <div><p class="eyebrow">Teste do protótipo</p><h2 id="feedback-titulo">Como foi a busca?</h2></div>
      <button class="close-button" value="close" aria-label="Fechar">×</button>
    </form>
    <form id="feedback-form">
      <label for="feedback-task">O que você veio fazer?</label>
      <select id="feedback-task" name="task" required>
        <option value="">Selecione uma opção</option><option>Escolher um livro</option><option>Resolver uma dúvida</option><option>As duas coisas</option>
      </select>
      <label for="feedback-result">Você encontrou o que precisava?</label>
      <select id="feedback-result" name="result" required>
        <option value="">Selecione uma opção</option><option>Sim</option><option>Em parte</option><option>Ainda não</option>
      </select>
      <label for="feedback-note">Qual busca você fez ou o que faltou? <span>(opcional)</span></label>
      <textarea id="feedback-note" name="note" rows="3" maxlength="1000"></textarea>
      <p class="feedback-help">Copie suas respostas e mande para quem compartilhou o link com você.</p>
      <button class="primary-button" type="submit">Copiar feedback</button>
      <p id="feedback-status" role="status"></p>
      <textarea id="feedback-copy" aria-label="Feedback pronto para copiar" rows="5" readonly hidden></textarea>
    </form>
  </dialog>
  <noscript><p class="shell">Ative o JavaScript do navegador para buscar e abrir os guias de leitura.</p></noscript>
</body>
</html>
